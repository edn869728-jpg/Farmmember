<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>🌾 Farmmember</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game">

  <!-- ── TOP BAR ── -->
  <header id="top-bar">
    <div class="stat-badge" id="level-badge">
      <span class="icon">⭐</span>
      <span id="level">Lv.1</span>
    </div>
    <div class="xp-bar-wrap" title="經驗值">
      <div id="xp-bar"></div>
    </div>
    <div class="stat-badge">
      <span class="icon">🎫</span>
      <span id="points-display">50</span>
    </div>
    <div class="stat-badge" id="weather-badge" title="今日天氣（埔里）">
      <span id="weather-display">🌤 --°C</span>
    </div>
  </header>

  <!-- ── CROP EXCHANGE POINTS PANEL ── -->
  <div id="crop-points-panel">
    <!-- rendered by game.js -->
  </div>

  <!-- ── MAIN FARM (3×5 grid, 15 cells) ── -->
  <main id="farm-area">
    <div id="farm-grid">
      <!-- cells injected by game.js -->
    </div>
  </main>

  <!-- ── BOTTOM MENU ── -->
  <footer id="bottom-menu">
    <div id="seed-row">
      <!-- seed buttons injected by game.js -->
    </div>
    <div id="action-row">
      <button class="action-btn" id="water-btn">💧 澆水</button>
      <button class="action-btn" id="harvest-all-btn">🌾 採收</button>
      <button class="action-btn" id="shop-btn">🏪 商店</button>
      <button class="action-btn" id="qr-btn">📱 QR碼</button>
    </div>
  </footer>

</div><!-- #game -->

<!-- ── SHOP MODAL ── -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-header">
      <h2>🏪 種子商店</h2>
      <button id="modal-close">✕</button>
    </div>
    <div id="shop-list">
      <!-- shop items injected by game.js -->
    </div>
  </div>
</div>

<!-- ── PHONE BINDING MODAL ── -->
<div id="phone-modal">
  <div id="phone-box">
    <div class="phone-header">
      <span class="phone-icon">📱</span>
      <h2>請輸入電話號碼</h2>
    </div>
    <p class="phone-hint">首次使用需要綁定電話號碼<br>方便店員為您查詢會員資料</p>
    <input type="tel" id="phone-input" placeholder="例如：0912345678" maxlength="15" />
    <button id="phone-submit-btn">儲存</button>
  </div>
</div>

<!-- ── QR CODE MODAL ── -->
<div id="qr-modal-overlay">
  <div id="qr-modal">
    <div class="modal-header">
      <h2>📱 我的 QR Code</h2>
      <button id="qr-modal-close">✕</button>
    </div>
    <div id="qr-code-container"></div>
    <div id="qr-user-info"></div>
    <p class="qr-hint">請店員掃描此 QR Code 為您累積消費點數</p>
  </div>
</div>

<!-- ── LEVEL-UP POPUP ── -->
<div id="levelup-popup">
  <div id="levelup-banner">🎉 升級！🎉</div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<!-- ── SCRIPTS ── -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="game.js"></script>
</body>
</html>
